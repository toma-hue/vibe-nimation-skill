<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Rig test</title></head>
<body>
<canvas id="c" width="200" height="200"></canvas>
<script type="module">
// Automated rig checks, run headless by tools/rigtest.mjs (results in window.RIGTEST = { pass, fail, lines }).
//   rigtest.html?ids=mike,joyce&only=hair,hands,reach      (&debug=mike,prof+ draws that hair test, failing samples marked)
// Every character in data/characters.json × the 8 views. Heads are rendered with a flat test palette
// (skin red, hair blue, clothes green) and pixels are classified:
//   hair     no skin above the hairline / temples / ear line where hair must be (per view)
//   profile  the profile hair is one connected shape with no ink lines inside it
//   back     from behind: neck centre on the head's and the shoulders' axis; the skin below the hair is a nape
//            flowing into the neck (no ink line across it like a chin, narrower than the skull, no bulge)
//   hands    every gesture renders a hand in every view, both arms rooted at their shoulders
//   reach    every anchor: the hand's contact point lands on the target (< 6 px), arm rooted at the shoulder (< 2 px)
import { drawCharacter, GESTURES, ANCHORS } from './src/core/rig.js';
import { hairParams } from './src/core/hair.js';
import { faceParams, faceGeom } from './src/core/face.js';
const q = new URLSearchParams(location.search);
const VIEWS = [['front', { turn: 0 }], ['3q-r', { turn: 0.55 }], ['3q-l', { turn: -0.55 }], ['prof-r', { turn: 1 }], ['prof-l', { turn: -1 }], ['back', { back: true }], ['bq-r', { back: true, turn: 0.55 }], ['bq-l', { back: true, turn: -0.55 }]];
const res = { pass: 0, fail: 0, lines: [] }, DEBUG = q.get('debug') && q.get('debug').split(',');
const ok = (name, good, msg) => { if (good) res.pass++; else { res.fail++; res.lines.push(`FAIL ${name}: ${msg}`); } };

const cv = document.createElement('canvas'); cv.width = 420; cv.height = 460;
const ctx = cv.getContext('2d', { willReadFrequently: true });
function testSpec(S) {
  const T = JSON.parse(JSON.stringify(S));
  T.skin = '#FF0000'; T.hair = { ...(T.hair || {}), color: '#0000FF' }; T.brows = { ...(T.brows || {}), color: '#FF00FF' };
  T.top = { ...(T.top || {}), color: '#00C000', inner: '#00A800', detail: undefined }; T.bottom = { ...(T.bottom || {}), color: '#009000' };
  T.shoes = { color: '#808080', sole: '#909090' }; T.eyes = { ...(T.eyes || {}), iris: '#FFFF00', color: '#FFFF00' };
  T.accessories = []; T.face = { ...(T.face || {}), glasses: false, beard: undefined, mustache: false };
  return T;
}
// pixel classes: 1 skin, 2 hair, 3 ink, 4 clothes, 0 other/background
function cls(d, i) {
  const r = d[i], g = d[i + 1], b = d[i + 2];
  if (r > 120 && r > g + 80 && r > b + 80) return 1;
  if (b > 120 && b > r + 60 && b > g + 60) return 2;
  if (r < 75 && g < 75 && b < 75) return 3;
  if (g > 100 && g > r + 30 && g > b + 30) return 4;
  return 0;
}
let img;
function render(S, v, sc, cx, cy, extra = {}) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, cv.width, cv.height);
  const h = (S.build || {}).height || 1, hk = (S.build || {}).headSize || 1, probe = {};
  const feet = cy + sc * h * (760 + 80 * hk);       // head centre (≈ −840) lands near cy
  drawCharacter(ctx, S, cx, feet, sc, { ...v, t: 0, wind: 0, shadow: false, expr: 'neutral', probe, ...extra });
  img = ctx.getImageData(0, 0, cv.width, cv.height).data;
  return probe;
}
const at = (x, y) => { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= cv.width || y >= cv.height) return 0; return cls(img, (y * cv.width + x) * 4); };
const tp = (M, x, y) => { const p = M.transformPoint({ x, y }); return [p.x, p.y]; };

// ---------- hair coverage: head-local regions (in the view's drawn frame) that must be hair ----------
function mustBeHair(S, vn) {
  const p = hairParams(S), F = faceParams(S), g = faceGeom(F), W = g.W, H = p.hairline - p.quiff * 6, pts = [];
  const grid = (x0, x1, y0, y1, f = () => true) => { for (let y = y0; y <= y1; y += 3) for (let x = x0; x <= x1; x += 3) if (f(x, y)) pts.push([x, y]); };
  if (vn === 'front' || vn.startsWith('3q')) {
    const k = vn === 'front' ? 0 : (0.55 - 0.3) / 0.45, cx = 14 + 14 * k, m = vn === 'front' ? (x) => x : (x) => (x < 0 ? cx + x * (cx + W + 6 * k) / W : cx + x * (42 + 4 * k) / W);
    grid(-W + 4, W - 4, -935, H - 8, () => true); grid(-W + 2, -W + 9, -878, -854); if (vn === 'front') grid(W - 9, W - 2, -878, -854);
    return pts.map(([x, y]) => [m(x), y]);
  }
  if (vn.startsWith('prof')) {
    const lx = (y) => lerp(56, 24, clamp((y - H) / (-852 - H)));        // the hairline from the forehead back to the temple
    grid(-100, 50, -960, -852, (x, y) => y < H - 8 || x < lx(y) - 8); grid(-100, -44, -852, -836);
    return pts;
  }
  if (vn === 'back') { grid(-W + 2, W - 2, -940, -842); return pts; }
  grid(-W + 10, W - 4, -940, -846); return pts;                       // 3/4 from behind (near side = −x shows the cheek)
}
const lerp = (a, b, t) => a + (b - a) * t, clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

function hairTests(S0) {
  const S = testSpec(S0), hk = (S.build || {}).headSize || 1, sc = 0.95 / ((S.build || {}).height || 1) / hk * 1.0;
  for (const [vn, v] of VIEWS) {
    const pr = render(S, v, sc, 210, 170), M = pr.head;
    if (!hairParams(S)) continue;
    const pts = mustBeHair(S, vn); let skin = 0;
    const bad = []; for (const [x, y] of pts) { const [px, py] = tp(M, x, y); if (at(px, py) === 1) { skin++; bad.push([px, py]); } }
    if (DEBUG && DEBUG[0] === S.id && DEBUG[1] === vn) { const o = document.getElementById('c'), oc = o.getContext('2d'); o.width = cv.width; o.height = cv.height; oc.drawImage(cv, 0, 0); oc.fillStyle = '#000'; for (const [x, y] of pts) { const [px, py] = tp(M, x, y); oc.fillRect(px, py, 1, 1); } oc.fillStyle = '#FF0'; for (const [px, py] of bad) oc.fillRect(px - 1, py - 1, 3, 3); }
    ok(`hair ${S.id} ${vn}`, skin <= Math.max(3, pts.length * 0.01), `${skin}/${pts.length} skin samples where hair must be`);
    if (vn.startsWith('prof')) profileTests(S, vn, M);
    if (vn === 'back' || vn.startsWith('bq')) backTests(S, vn, render(S, v, sc, 210, 170, { pose: { L: [1.6, 0], R: [1.6, 0], legL: [0.05, 0, 0], legR: [0.05, 0, 0] } }));
  }
}
function profileTests(S, vn, M) {
  // bounding box of the head in pixels
  const cs = [[-220, -1010], [150, -1010], [-220, -640], [150, -640]].map(([x, y]) => tp(M, x, y));
  const x0 = Math.max(0, Math.floor(Math.min(...cs.map((c) => c[0])))), x1 = Math.min(cv.width - 1, Math.ceil(Math.max(...cs.map((c) => c[0]))));
  const y0 = Math.max(0, Math.floor(Math.min(...cs.map((c) => c[1])))), y1 = Math.min(cv.height - 1, Math.ceil(Math.max(...cs.map((c) => c[1]))));
  const w = x1 - x0 + 1, h = y1 - y0 + 1, mask = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) mask[y * w + x] = at(x0 + x, y0 + y) === 2 ? 1 : 0;
  // connected components (4-connected) of hair, ignoring specks
  const lab = new Int32Array(w * h); let comps = 0; const stack = [];
  for (let i = 0; i < w * h; i++) if (mask[i] && !lab[i]) {
    let n = 0; stack.push(i); lab[i] = -1;
    while (stack.length) { const j = stack.pop(); n++; const x = j % w, y = (j / w) | 0; for (const k of [x > 0 ? j - 1 : -1, x < w - 1 ? j + 1 : -1, y > 0 ? j - w : -1, y < h - 1 ? j + w : -1]) if (k >= 0 && mask[k] && !lab[k]) { lab[k] = -1; stack.push(k); } }
    if (n > 30) comps++;
  }
  ok(`profile-shape ${S.id} ${vn}`, comps === 1, `hair is ${comps} separate shapes`);
  // ink inside the mass: an ink pixel with hair 5 px away on all four sides
  let inner = 0; const isH = (x, y) => x >= 0 && y >= 0 && x < w && y < h && mask[y * w + x];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (at(x0 + x, y0 + y) === 3 && isH(x - 5, y) && isH(x + 5, y) && isH(x, y - 5) && isH(x, y + 5)) inner++;
  ok(`profile-ink ${S.id} ${vn}`, inner <= 4, `${inner} ink pixels inside the hair`);
}
function rowRun(y, x, f, gap = 1) {           // the run of pixels satisfying f through (x, y), allowing tiny gaps
  y = Math.round(y); x = Math.round(x); if (!f(at(x, y))) return null;
  let l = x, r = x, miss = 0;
  for (let xx = x - 1; xx >= 0; xx--) { if (f(at(xx, y))) { l = xx; miss = 0; } else if (++miss > gap) break; }
  miss = 0; for (let xx = x + 1; xx < cv.width; xx++) { if (f(at(xx, y))) { r = xx; miss = 0; } else if (++miss > gap) break; }
  return [l, r];
}
function backTests(S, vn, pr) {
  const M = pr.head, B = pr.body, p = hairParams(S);
  const [hx, hy] = tp(M, 0, -850), sk = rowRun(hy, hx, (c) => c > 0 && c !== 4, 2); if (!sk) { ok(`back ${S.id} ${vn}`, false, 'no head at y −850'); return; }
  const skullW = sk[1] - sk[0], headX = (sk[0] + sk[1]) / 2;
  // walk down the head's centre line to the first skin below the hair
  let y = hy, x = headX; while (y < cv.height - 1 && at(x, y) !== 1) y++;
  const [, neckY] = tp(B, 0, -722), [, shY] = tp(B, 0, -640);
  if (y >= neckY) { if (p && p.length > -740) return; ok(`back-nape ${S.id} ${vn}`, false, 'no skin below the hair'); return; }
  const nk = rowRun(neckY, x, (c) => c === 1, 1) || rowRun(neckY, x + 4, (c) => c === 1, 1) || rowRun(neckY, x - 4, (c) => c === 1, 1);
  if (!nk) { ok(`back-neck ${S.id} ${vn}`, false, 'no neck under the head'); return; }
  const neckX = (nk[0] + nk[1]) / 2, sh = rowRun(shY, neckX, (c) => c === 4, 1), shX = sh ? (sh[0] + sh[1]) / 2 : NaN;
  const tol = (vn === 'back' ? 0.05 : 0.12) * skullW;
  ok(`back-axis ${S.id} ${vn}`, Math.abs(neckX - headX) <= tol && Math.abs(neckX - shX) <= tol * 1.5, `head ${headX.toFixed(0)} neck ${neckX.toFixed(0)} shoulders ${shX.toFixed(0)} (tol ${tol.toFixed(1)})`);
  // the skin from the hair down to the collar: no ink line across it, narrower than the skull, no bulge
  let ink = 0, maxW = 0;
  for (let yy = y + 2; yy < neckY; yy++) {
    const cl = at(neckX, yy); if (cl === 4) break; if (cl === 3) ink++;
    const run = rowRun(yy, neckX, (c) => c === 1, 2); if (run) maxW = Math.max(maxW, run[1] - run[0]);
  }
  const neckW = nk[1] - nk[0], bulge = maxW > neckW * (vn === 'back' ? 1.45 : 1.8) + 3;
  ok(`back-nape ${S.id} ${vn}`, ink <= 1 && !bulge && maxW <= (vn === 'back' ? 0.62 : 0.75) * skullW, `ink across ${ink}, widest skin below the hair ${maxW}px vs neck ${neckW}px, skull ${skullW}px`);
}

// ---------- hands and reach ----------
function handTests(S0) {
  const S = testSpec(S0), h = (S.build || {}).height || 1, sc = 0.42 / h;
  for (const [vn, v] of VIEWS) for (const g of GESTURES) {
    const pr = render(S, v, sc, 210, 120, { pose: 'point', hand: { L: g, R: g } }), A = pr.arms || {};
    ok(`hands ${S.id} ${vn} ${g}`, A.L && A.R, 'an arm is missing');
    if (!A.R) continue;
    let n = 0; const [cx, cy] = A.R.hand, r = 30 * sc * 1.6;
    for (let yy = -r; yy <= r; yy++) for (let xx = -r; xx <= r; xx++) if (at(cx + xx, cy + yy) === 1) n++;
    ok(`hand ${S.id} ${vn} ${g}`, n > 40 * sc * sc * 10, `hand nearly empty (${n} px)`);
    for (const k of ['L', 'R']) if (A[k]) ok(`hand-root ${S.id} ${vn} ${g} ${k}`, Math.hypot(A[k].root[0] - A[k].shoulder[0], A[k].root[1] - A[k].shoulder[1]) < 2, 'arm not at the shoulder');
  }
}
function reachTests(S0) {
  const S = testSpec(S0), h = (S.build || {}).height || 1, sc = 1 / h;
  const targets = [...ANCHORS.map((a) => [a, a]), ['xy', [70, -560]]];
  for (const [vn, v] of VIEWS) for (const [an, tg] of targets) for (const g of ['gun', 'open']) for (const tilt of [0, 0.15]) {
    const pr = render(S, v, sc * 0.4, 210, 120, { reach: { R: tg }, hand: { R: g }, headTilt: tilt, pose: 'idle' }), A = pr.arms || {};
    const name = `reach ${S.id} ${vn} ${an} ${g}${tilt ? ' tilt' : ''}`;
    if (!A.L || !A.R) { ok(name, false, 'an arm is missing'); continue; }
    // errors in character units (the probe is in pixels at scale 0.4·sc)
    const k = 1 / (sc * 0.4 * h), R = A.R, eT = Math.hypot(R.tip[0] - R.anchor[0], R.tip[1] - R.anchor[1]) * k;
    const eS = Math.max(...['L', 'R'].map((q) => Math.hypot(A[q].root[0] - A[q].shoulder[0], A[q].root[1] - A[q].shoulder[1]) * k));
    const l1 = Math.hypot(R.elbow[0] - R.root[0], R.elbow[1] - R.root[1]) * k, l2 = Math.hypot(R.wrist[0] - R.elbow[0], R.wrist[1] - R.elbow[1]) * k;
    ok(name, eT < 6 && eS < 2 && l1 <= 140.5 && l2 <= 128.5, `target off by ${eT.toFixed(1)}, root ${eS.toFixed(1)}, arm ${l1.toFixed(0)}/${l2.toFixed(0)}`);
  }
}

(async () => {
  const d = await (await fetch(q.get('file') || 'data/characters.json')).json();
  let list = d.characters || d; const ids = (q.get('ids') || '').split(',').filter(Boolean); if (ids.length) list = list.filter((c) => ids.includes(c.id));
  const only = (q.get('only') || 'hair,hands,reach').split(',');
  if (DEBUG) list = list.filter((c) => c.id === DEBUG[0]);
  for (const S of list) {
    if (only.includes('hair')) hairTests(S);
    if (only.includes('hands')) handTests(S);
    if (only.includes('reach')) reachTests(S);
  }
  if (DEBUG) { window.DONE = true; return; }
  window.RIGTEST = res; window.DONE = true;
})().catch((e) => { window.RIGTEST = { pass: 0, fail: 1, lines: ['ERROR ' + e.stack] }; window.DONE = true; });
</script>
</body></html>
