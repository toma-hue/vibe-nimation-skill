<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><title>Verificare rig</title>
<style>html,body{margin:0;background:#1A1519}canvas{display:block;max-width:100%;height:auto}</style></head>
<body>
<canvas id="c" width="2400" height="1700"></canvas>
<script type="module">
// QA matrices for one character — every view × every expression, every pose × every view:
//   rigcheck.html?id=mike&page=heads     6 views × 8 expressions, big heads
//   rigcheck.html?id=mike&page=bodies    10 poses × 5 views, full body
//   rigcheck.html?page=faces             face lineup: every character, front + 3/4, neutral, hair as a flat silhouette
//   rigcheck.html?page=review&ids=a,b    review pack: the cast line-up + one row of heads per changed character
//   rigcheck.html?id=mike&page=props     props × views: riding a bike, the bike alone, held props, every series prop
//   rigcheck.html?id=mike&page=hands     hands: every gesture (arm out) + reach targets (gun to the temple, hand to mouth /
//                                        chin / eye / hip / other hand) × the 8 views, upper body
// Read them cell by cell: hair covers the head in every view (no bald sides), accessories sit on the head,
// eyes/brows/mouth read as the named expression, limbs attached, feet on the floor line; hands: two arms, each from its
// own shoulder, the hand shape readable, the reaching hand ON the target (temple, mouth…) in every view.
import { drawCharacter, EXPR, walkPose, GESTURES } from './src/core/rig.js';
const q = new URLSearchParams(location.search), cv = document.getElementById('c'), ctx = cv.getContext('2d');
const BG = '#1A1519', CELL = '#2E2733', LABEL = '#6E1B2E', TXT = '#F3E9EC', DIM = '#B7A9B0';
const VIEWS = [['FAȚĂ', { turn: 0 }], ['3/4 DR', { turn: 0.55 }], ['PROFIL DR', { turn: 1 }], ['3/4 ST', { turn: -0.55 }], ['PROFIL ST', { turn: -1 }], ['SPATE', { back: true }], ['3/4 SPATE DR', { back: true, turn: 0.55 }], ['3/4 SPATE ST', { back: true, turn: -0.55 }]];
const EXP = [['neutru', 'neutral'], ['fericit', 'happy'], ['furios', 'angry'], ['vorbește', 'shout'], ['șocat', 'shocked'], ['trist', 'sad'], ['speriat', 'scared'], ['plânge', 'crying']];
const POSES = [['stă', 'idle'], ['merge', walkPose(0.2)], ['aleargă', walkPose(0.3, true)], ['arată', 'point'], ['brațe încrucișate', 'crossed'], ['mâini pe cap', 'handsOnHead'], ['bucurie', 'cheer'], ['așezat', 'sit'], ['îngenunchiat', 'kneel'], ['salută', 'wave']];
function txt(s, x, y, size = 22, col = TXT, align = 'center') { ctx.font = `700 ${size}px Inter, Arial`; ctx.fillStyle = col; ctx.textAlign = align; ctx.fillText(s, x, y); ctx.textAlign = 'left'; }

function heads(S) {
  const cw = 280, ch = 255, x0 = 150, y0 = 110, h = (S.build || {}).height || 1, hk = (S.build || {}).headSize || 1, sc = 0.95 / hk;
  cv.width = x0 + cw * EXP.length + 20; cv.height = y0 + ch * VIEWS.length + 20;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, cv.width, cv.height);
  txt(`${S.name} — perspective × expresii`, 30, 56, 34, TXT, 'left');
  EXP.forEach(([n], j) => txt(n.toUpperCase(), x0 + cw * j + cw / 2, y0 - 14, 20, DIM));
  VIEWS.forEach(([vn, v], i) => {
    txt(vn, 20, y0 + ch * i + ch / 2 + 8, 20, DIM, 'left');
    EXP.forEach(([, e], j) => {
      const x = x0 + cw * j, y = y0 + ch * i;
      ctx.save(); ctx.beginPath(); ctx.roundRect(x + 4, y + 4, cw - 8, ch - 8, 10); ctx.fillStyle = CELL; ctx.fill(); ctx.clip();
      // place the head centre in the cell: centre = feet + s·h·(−760 − 70·headK)
      const hat = (S.accessories || []).some((a) => a.type === 'hat') ? 62 : 0;   // headroom for a crown
      const feet = y + ch / 2 + 6 + hat + sc * h * (760 + 70 * hk);
      drawCharacter(ctx, S, x + cw / 2, feet, sc, { ...v, expr: v.back ? 'neutral' : e, talk: e === 'shout' ? 0.6 : 0, t: 0.3, wind: 0, shadow: false });
      ctx.restore();
    });
  });
}
function bodies(S) {
  const BV = VIEWS.filter(([n]) => n !== 'PROFIL ST');
  const cw = 230, ch = 330, x0 = 150, y0 = 110, sc = 0.27 / Math.max(1, (S.build || {}).height || 1);
  cv.width = x0 + cw * POSES.length + 20; cv.height = y0 + ch * BV.length + 20;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, cv.width, cv.height);
  txt(`${S.name} — poziții × perspective`, 30, 56, 34, TXT, 'left');
  POSES.forEach(([n], j) => txt(n.toUpperCase(), x0 + cw * j + cw / 2, y0 - 14, 17, DIM));
  BV.forEach(([vn, v], i) => {
    txt(vn, 20, y0 + ch * i + ch / 2 + 8, 20, DIM, 'left');
    POSES.forEach(([n, p], j) => {
      const x = x0 + cw * j, y = y0 + ch * i;
      ctx.save(); ctx.beginPath(); ctx.roundRect(x + 4, y + 4, cw - 8, ch - 8, 10); ctx.fillStyle = CELL; ctx.fill(); ctx.clip();
      ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.moveTo(x, y + ch - 30); ctx.lineTo(x + cw, y + ch - 30); ctx.stroke();   // floor line
      drawCharacter(ctx, S, x + cw / 2, y + ch - 30, sc, { ...v, pose: p, expr: n === 'mâini pe cap' ? 'shocked' : n === 'bucurie' ? 'laugh' : 'neutral', t: 0.3, wind: 0 });
      ctx.restore();
    });
  });
}
const headFeet = (S, sc, cy) => { const h = (S.build || {}).height || 1, hk = (S.build || {}).headSize || 1; return cy + sc * h * (760 + 70 * hk); };
const flatHair = (S) => ({ ...S, _flatHair: true, accessories: (S.accessories || []).filter((a) => !['cap', 'beanie', 'hat', 'headband'].includes(a.type)) });
const byRole = (list) => [...list].sort((a, b) => (a.role === 'main' ? 0 : 1) - (b.role === 'main' ? 0 : 1));

function faces(list) {
  const L = byRole(list), cols = Math.min(7, L.length), rows = Math.ceil(L.length / cols), cw = 360, ch = 300, x0 = 20, y0 = 90;
  cv.width = x0 * 2 + cw * cols; cv.height = y0 + ch * rows + 20;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, cv.width, cv.height);
  txt('Fețe — față + 3/4, neutru, părul ca siluetă plată (nicio față nu trebuie să semene cu alta)', 30, 56, 30, TXT, 'left');
  L.forEach((S, i) => {
    const x = x0 + (i % cols) * cw, y = y0 + Math.floor(i / cols) * ch, F = flatHair(S);
    ctx.save(); ctx.beginPath(); ctx.roundRect(x + 4, y + 4, cw - 8, ch - 70, 10); ctx.fillStyle = CELL; ctx.fill(); ctx.clip();
    const hk = (S.build || {}).headSize || 1, h = (S.build || {}).height || 1, sc = 0.66 / (hk * h);
    drawCharacter(ctx, F, x + cw * 0.28, headFeet(S, sc, y + 140), sc, { t: 0.3, wind: 0, shadow: false });
    drawCharacter(ctx, F, x + cw * 0.72, headFeet(S, sc, y + 140), sc, { t: 0.3, wind: 0, shadow: false, turn: 0.55 });
    ctx.restore();
    txt(S.name, x + cw / 2, y + ch - 40, 19, TXT); txt((S.faceRead || '').split(';').pop().replace('signature:', '').trim().slice(0, 44), x + cw / 2, y + ch - 20, 14, DIM);
  });
}
function review(list, ids) {
  const L = byRole(list), pick = L.filter((c) => ids.includes(c.id)), cw = 250, ch = 250, x0 = 150, top = 380;
  const cells = [['FAȚĂ', { turn: 0 }, 'neutral'], ['3/4 DR', { turn: 0.55 }, 'neutral'], ['PROFIL DR', { turn: 1 }, 'neutral'], ['3/4 ST', { turn: -0.55 }, 'neutral'], ['PROFIL ST', { turn: -1 }, 'neutral'], ['SPATE', { back: true }, 'neutral'], ['3/4 SPATE', { back: true, turn: 0.55 }, 'neutral'], ['3/4 FURIOS', { turn: 0.55 }, 'angry'], ['FAȚĂ VORBEȘTE', { turn: 0 }, 'shout']];
  cv.width = Math.max(x0 + cw * cells.length + 20, 2000); cv.height = top + 40 + ch * pick.length + 20;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, cv.width, cv.height);
  txt('Review — distribuția + capetele personajelor modificate', 30, 50, 30, TXT, 'left');
  const n = L.length, sw = (cv.width - 60) / n;                         // line-up strip at true relative heights
  L.forEach((S, i) => { const x = 30 + sw * (i + 0.5); drawCharacter(ctx, S, x, top - 20, Math.min(0.3, sw / 300), { t: 0.3, wind: 0, turn: 0.15 }); txt(S.name.split(' ')[0], x, top + 6, 15, ids.includes(S.id) ? '#FFD400' : DIM); });
  cells.forEach(([n2], j) => txt(n2, x0 + cw * j + cw / 2, top + 34, 16, DIM));
  pick.forEach((S, i) => {
    const y = top + 40 + ch * i; txt(S.name, 20, y + ch / 2, 18, TXT, 'left');
    const hk = (S.build || {}).headSize || 1, sc = 0.9 / hk;
    cells.forEach(([, v, e], j) => {
      const x = x0 + cw * j; ctx.save(); ctx.beginPath(); ctx.roundRect(x + 4, y + 4, cw - 8, ch - 8, 10); ctx.fillStyle = CELL; ctx.fill(); ctx.clip();
      const hat = (S.accessories || []).some((a) => a.type === 'hat') ? 62 : 0;
      drawCharacter(ctx, S, x + cw / 2, headFeet(S, sc, y + ch / 2 + 10 + hat), sc, { ...v, expr: v.back ? 'neutral' : e, talk: e === 'shout' ? 0.6 : 0, t: 0.3, wind: 0, shadow: false });
      ctx.restore();
    });
  });
}

function hands(S) {
  const cols = [...GESTURES.map((g) => [g, { pose: { L: [0.15, -0.1], R: [0.45, 2.1], legL: [0.05, 0, 0], legR: [0.05, 0, 0] }, hand: { R: g } }]),
    ['gun → temple', { pose: 'gunTemple' }], ['salute', { pose: 'salute' }], ['shush', { pose: 'shush' }], ['chin', { pose: 'chinRest' }],
    ['facepalm', { pose: 'facepalm' }], ['hips', { pose: 'handsOnHips' }], ['clasp', { pose: 'clasp' }]];
  const cw = 230, ch = 300, x0 = 150, y0 = 110, h = (S.build || {}).height || 1, sc = 0.5 / h;
  cv.width = x0 + cw * cols.length + 20; cv.height = y0 + ch * VIEWS.length + 20;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, cv.width, cv.height);
  txt(`${S.name} — mâini × perspective (gesturi cu brațul întins, apoi ținte: mâna ajunge exact pe țintă)`, 30, 56, 30, TXT, 'left');
  cols.forEach(([n], j) => txt(n.toUpperCase(), x0 + cw * j + cw / 2, y0 - 14, 15, DIM));
  VIEWS.forEach(([vn, v], i) => {
    txt(vn, 20, y0 + ch * i + ch / 2 + 8, 18, DIM, 'left');
    cols.forEach(([, o], j) => {
      const x = x0 + cw * j, y = y0 + ch * i;
      ctx.save(); ctx.beginPath(); ctx.roundRect(x + 4, y + 4, cw - 8, ch - 8, 10); ctx.fillStyle = CELL; ctx.fill(); ctx.clip();
      drawCharacter(ctx, S, x + cw / 2, y + 40 + sc * h * 930, sc, { ...v, ...o, expr: 'neutral', t: 0.3, wind: 0, shadow: false });
      ctx.restore();
    });
  });
}

async function props(S) {
  const PR = await import('./src/props.js'), cw = 270, ch = 330, x0 = 170, y0 = 110;
  const extra = Object.entries(PR).filter(([n, f]) => typeof f === 'function' && !['rideBike', 'held', 'bikeTargets', 'bike', 'walkie', 'flashlight'].includes(n));
  const rows = [];
  if (PR.rideBike) rows.push(['PE BICICLETĂ', (c, x, y, v) => PR.rideBike(c, S, x, y, 0.2, { ...v, pedal: x * 0.01, wind: 0 })]);
  if (PR.bike) rows.push(['BICICLETA', (c, x, y, v) => PR.bike(c, x, y, 0.2, { ...v, turn: v.turn ?? 0 })]);
  if (PR.held && PR.flashlight) rows.push(['LANTERNĂ ÎN MÂNĂ', (c, x, y, v) => drawCharacter(c, S, x, y, 0.2, { ...v, pose: 'point', wind: 0, hold: { R: PR.held(PR.flashlight, { alongArm: true, beam: 500 }) } })]);
  if (PR.held && PR.walkie) rows.push(['STAȚIE ÎN MÂNĂ', (c, x, y, v) => drawCharacter(c, S, x, y, 0.2, { ...v, pose: 'wave', wind: 0, hold: { R: PR.held(PR.walkie, { led: true, dy: 20 }) } })]);
  const cols = Math.max(VIEWS.length, extra.length);
  cv.width = x0 + cw * cols + 20; cv.height = y0 + ch * (rows.length + (extra.length ? 1 : 0)) + 20;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, cv.width, cv.height);
  txt(`${S.name} — obiecte × perspective (din spate obiectul trebuie să se vadă corect: roata din față după picioare, mâna care ascunde obiectul)`, 30, 56, 26, TXT, 'left');
  VIEWS.forEach(([vn], j) => txt(vn, x0 + cw * j + cw / 2, y0 - 14, 17, DIM));
  const cell = (i, j, f) => { const x = x0 + cw * j, y = y0 + ch * i; ctx.save(); ctx.beginPath(); ctx.roundRect(x + 4, y + 4, cw - 8, ch - 8, 10); ctx.fillStyle = CELL; ctx.fill(); ctx.clip(); f(x + cw / 2, y + ch - 30); ctx.restore(); };
  rows.forEach(([n, f], i) => { txt(n, 20, y0 + ch * i + ch / 2, 17, DIM, 'left'); VIEWS.forEach(([, v], j) => cell(i, j, (x, y) => f(ctx, x, y, v))); });
  if (extra.length) { const i = rows.length; txt('OBIECTELE SERIALULUI', 20, y0 + ch * i + ch / 2, 15, DIM, 'left'); extra.forEach(([n, f], j) => cell(i, j, (x, y) => { try { f(ctx, x, y, 0.2, { t: 0.3 }); } catch (e) { txt('eroare: ' + n, x, y - 100, 14, '#f88'); } txt(n, x, y + 22, 14, DIM); })); }
}

(async () => {
  const f = new FontFace('Inter', 'url(fonts/Inter.ttf)', { weight: '100 900' }); await f.load(); document.fonts.add(f);
  const d = await (await fetch(q.get('file') || 'data/characters.json')).json(), list = d.characters || d;
  if (q.get('page') === 'faces') faces(list);
  else if (q.get('page') === 'review') review(list, (q.get('ids') || '').split(',').filter(Boolean).length ? q.get('ids').split(',') : list.map((c) => c.id));
  else { const S = list.find((c) => c.id === q.get('id')) || list[0]; await ({ bodies, props, hands }[q.get('page')] || heads)(S); }
  window.DONE = true;
})().catch((e) => { document.body.insertAdjacentHTML('beforeend', `<pre style="color:#f88">${e.stack}</pre>`); window.DONE = 'error: ' + e.message; });
</script>
</body></html>
